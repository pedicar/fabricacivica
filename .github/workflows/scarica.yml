name: scarica
on:
  push:
    paths: ['scarica.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scarica i file elencati in scarica.txt
        run: |
          mkdir -p scaricati
          while IFS='|' read -r nome url; do
            [ -z "$nome" ] && continue
            curl -sSL -o "scaricati/$nome" "$url"
          done < scarica.txt
          ls -la scaricati
      - name: commit
        run: |
          git config user.name "scarica-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scaricati
          git commit -m "scaricati" || echo "niente da committare"
          git push
